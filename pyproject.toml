[project]
name = "ai-engineering-roadmap"
version = "0.1.0"
description = "AI engineering learning playground: roadmap, progress tracking, and CLI tooling"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
roadmap = "tools.roadmap_cli.cli:app"

[project.optional-dependencies]
python = []
dsa = []
ml = [
    "numpy>=1.26",
    "torch>=2.2",
    "scikit-learn>=1.4",
]
applied-ai = [
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "claude-agent-sdk>=0.1",
    "mcp>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
