version: 1
start_date: 2026-11-16
end_date: 2027-01-24
total_days: 70
weekday_hours: 4
weekend_hours: 6
primary_role: agentic-ai
secondary_role: fde

domains:
  python:
    name: Python
    directory: python
    target_days: 8
    min_depth: "Typed, tested, packaged, profiled Python used as the implementation language for every other domain."
    supports_roles: [agentic-ai, fde, ml-engineer, inference, embedded-ml, test-validation]
  dsa:
    name: Data Structures & Algorithms
    directory: dsa
    target_days: 20
    min_depth: "Solve unseen large-tech-frequency problems cold, stating complexity, within interview time limits."
    supports_roles: [fde, agentic-ai]
  git:
    name: Git
    directory: git
    target_days: 2
    min_depth: "Comfortably rebase, bisect, and resolve conflicts without looking up the commands."
    supports_roles: [fde]
  systems:
    name: System Design
    directory: systems
    target_days: 6
    min_depth: "Design a serving/inference system with batching, caching, and failure isolation under stated load."
    supports_roles: [fde, agentic-ai, inference]
  ml:
    name: ML & DL
    directory: ml
    target_days: 12
    min_depth: "Implement core training/inference mechanisms from scratch; report metric, split, and baseline."
    supports_roles: [agentic-ai, ml-engineer, inference, embedded-ml, test-validation]
  applied-ai:
    name: Applied AI Engineering
    directory: applied-ai
    target_days: 22
    min_depth: "Build, evaluate and debug a tool-using agent and a retrieval pipeline end to end."
    supports_roles: [agentic-ai, fde, test-validation]

roles:
  agentic-ai:
    name: AI / Agentic AI Engineer
    tier: primary
    supporting_domains: [applied-ai, ml, python, systems]
  fde:
    name: Forward Deployed Engineer
    tier: secondary
    supporting_domains: [dsa, systems, applied-ai, git]
  ml-engineer:
    name: ML Engineer
    tier: remaining
    supporting_domains: [ml, python]
    evidence_required:
      - "One artifact exercising classical ML training and evaluation"
  inference:
    name: Inference Engineer
    tier: remaining
    supporting_domains: [ml, python, systems]
    evidence_required:
      - "One artifact measuring inference latency and memory against a baseline"
  embedded-ml:
    name: Embedded ML Engineer
    tier: remaining
    supporting_domains: [ml, python]
    evidence_required:
      - "One artifact exercising model size reduction"
  test-validation:
    name: AI Test Validation Engineer
    tier: remaining
    supporting_domains: [applied-ai, ml]
    evidence_required:
      - "One artifact exercising systematic test and validation of a model or model-backed system"

