- number: 1
  theme: Python engineering depth
  domains:
  - python
  - dsa
  outcome: Typed, tested, packaged, profiled Python with a committed lockfile.
  days:
  - id: 1
    date: 2026-11-16
    day_type: weekday
    objective: Stand up the repo toolchain and complete the worked example day.
    domain: python
    topic: project-tooling
    artifact: python/project-tooling/env_report.py
    verification: pytest python/project-tooling/ passes; roadmap validate exits 0
    notes_topic: Why a committed lockfile is the difference between reproducible and 'works here'
    effort_hours: 5.0
    dsa_hours: 1.0
    tier: primary
    priority: core
    gate:
    - pytest python/project-tooling/ passes; roadmap validate exits 0
    - python/project-tooling/NOTES.md carries all eleven required sections
    minimum_viable: Toolchain installed and `roadmap today` runs; defer the notes.
  - id: 2
    date: 2026-11-17
    day_type: weekday
    objective: Solve the arrays, hashing and prefix sums pattern from scratch with a shared test harness.
    domain: dsa
