milestones:
- id: agent-eval-observability-platform
  name: Agent evaluation and observability platform
  after_day: 36
  purpose: Ingest agent traces, score whole trajectories against labelled outcomes, gate releases on regression,
    and expose the result as a dashboard. Evaluation is the scarcest skill in agentic hiring and the one
    this learner's existing experience compounds fastest.
  demonstrates:
  - Trajectory scoring against a labelled trace set, not final-answer accuracy
  - Regression gating that distinguishes a real drop from run-to-run variance
  - OpenTelemetry-style tracing with per-step cost and latency attribution
  - Deployed, instrumented and debuggable from logs alone
  supports_roles:
  - agentic-ai
  - test-validation
  prerequisite_days:
  - 24
  - 28
  - 31
  - 32
  - 33
  - 35
  external: true
  record_path: promoted/README.md
- id: multi-backend-inference-gateway
  name: Multi-backend inference gateway
  after_day: 125
  purpose: A service routing requests across a local quantized model and a hosted API, with batching,
    response caching, rate-limit backoff and health-check fallback when a backend degrades.
  demonstrates:
  - Request batching and response caching under a stated load profile
  - Rate-limit backoff and automatic fallback, measured against a no-fallback baseline
  - Containerised, configurable, and debuggable from logs alone
  supports_roles:
  - fde
  - inference
  prerequisite_days:
  - 59
  - 62
  - 68
  - 81
  - 82
  - 123
  - 124
  external: true
  record_path: promoted/README.md
- id: production-mcp-server
  name: Production MCP server with governance
  after_day: 89
  purpose: An MCP server for a real domain with scoped permissions, a path jail, resources and prompts,
    an approval path for side-effecting tools, and an audit trail. Scarce production experience in a young
    protocol.
  demonstrates:
  - Least-privilege tool scoping with a provable sandbox boundary
  - Resources and prompts, not only tools
  - Audit logging and an approval gate for side-effecting calls
  - Deployed with authentication and monitored
  supports_roles:
  - agentic-ai
  - fde
  prerequisite_days:
  - 52
  - 53
  - 54
  - 56
  - 61
  - 88
  external: true
  record_path: promoted/README.md
