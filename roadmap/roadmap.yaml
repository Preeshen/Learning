version: 1
start_date: 2026-11-16
end_date: 2027-03-28
total_days: 133
weekday_hours: 6.0
weekend_hours: 5.0
primary_role: agentic-ai
secondary_role: fde
domains:
  python:
    name: Python & software engineering
    directory: python
    target_days: 12
    min_depth: Typed, tested, packaged, profiled Python plus OOP internals, SOLID and patterns.
    supports_roles:
    - agentic-ai
    - fde
    - ml-engineer
  dsa:
    name: Data Structures & Algorithms
    directory: dsa
    target_days: 20
    min_depth: All 20 interview-frequency patterns solved from scratch with asserted complexity.
    supports_roles:
    - fde
    - agentic-ai
  git:
    name: Git & Linux
    directory: git
    target_days: 6
    min_depth: Bisect, reflog, rebase and conflict recovery; shell, process and network diagnosis.
    supports_roles:
    - fde
  systems:
    name: System Design
    directory: systems
    target_days: 30
    min_depth: Networking, APIs, data modelling, queues, distributed fundamentals, observability.
    supports_roles:
    - fde
    - agentic-ai
    - ml-engineer
  ml:
    name: ML & DL
    directory: ml
    target_days: 18
    min_depth: Applied maths, classical ML, NN and attention internals, and the MLOps lifecycle.
    supports_roles:
    - ml-engineer
    - agentic-ai
    - inference
  applied-ai:
    name: Applied AI Engineering
    directory: applied-ai
    target_days: 36
    min_depth: LLM internals, retrieval depth, agentic patterns, protocols, evaluation, inference.
    supports_roles:
    - agentic-ai
    - fde
    - test-validation
    - inference
  cloud:
    name: Cloud & Infrastructure
    directory: cloud
    target_days: 8
    min_depth: Identity, storage, serverless, managed NoSQL, queues, containers, cost control.
    supports_roles:
    - fde
    - ml-engineer
roles:
  agentic-ai:
    name: AI / Agentic AI Engineer
    tier: primary
    supporting_domains:
    - applied-ai
    - ml
    - python
    - systems
  fde:
    name: Forward Deployed Engineer
    tier: secondary
    supporting_domains:
    - dsa
    - systems
    - git
    - cloud
    - python
  ml-engineer:
    name: ML / MLOps Engineer
    tier: remaining
    supporting_domains:
    - ml
    - systems
    - cloud
    evidence_required:
    - One artifact exercising the MLOps lifecycle (pipeline, registry, drift or serving)
  inference:
    name: Inference Engineer
    tier: remaining
    supporting_domains:
    - applied-ai
    - ml
    - systems
    evidence_required:
    - One artifact measuring inference latency and memory against a baseline
    - One artifact reducing model size with the trade reported
  test-validation:
    name: AI Test Validation Engineer
    tier: remaining
    supporting_domains:
    - applied-ai
    - ml
    - python
    evidence_required:
    - One artifact systematically testing and validating a model or model-backed system
